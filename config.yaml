data:
  ticker: ACB
  offline: true
  horizon: 5
  sequence_length: 20
  features:
    - return_1d
    - return_5d
    - return_10d
    - return_20d
    - MA_5
    - MA_10
    - MA_20
    - MA_50
    - rolling_volatility_5
    - rolling_volatility_20
    - volume_change
    - volume_ma_20
    - high_low_range
    - open_close_range
split:
  test: 0.15
  n_splits: 5
  test_size: 125
  gap: 5
warning:
  q_warning: 0.5
  q_high: 0.7
alert_policy:
  # Validation calibration limits; the selector favors recall within these limits.
  max_alert_rate: 0.15
  min_precision: 0.25
seed: 42
models:
  garch:
    mean: Zero
    distribution: normal
  xgboost:
    n_estimators: 160
    max_depth: 3
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
    min_child_weight: 1
    reg_lambda: 1.0
    # Giữ estimator một luồng; song song hóa ở tầng GridSearchCV.
    n_jobs: 1
    tuning:
      search_n_jobs: 2
      param_grid:
        n_estimators: [1, 2, 3, 4, 5]
        max_depth: [1, 2, 3]
        learning_rate: [0.01, 0.03, 0.05, 0.07, 0.09, 0.11]
        subsample: [0.4, 0.45, 0.5, 0.55, 0.6, 0.65]
        colsample_bytree: [0.1, 0.2, 0.3]
      fast_param_grid:
        n_estimators: [3]
        max_depth: [1, 2]
        learning_rate: [0.05]
        subsample: [0.5]
        colsample_bytree: [0.2]
  lstm:
    hidden_size: 32
    epochs: 25
    patience: 5
    batch_size: 32
    learning_rate: 0.001
    weight_decay: 0.0001
paths:
  raw: data/raw
  processed: data/processed
  artifacts: artifacts
